name: Nightly evals

on:
  schedule:
    # 21:30 UTC = 03:00 IST — quiet hours for an India-market product.
    - cron: "30 21 * * *"
  workflow_dispatch:

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  evals:
    name: Full scenario suite (main baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run full suite (records the main baseline the CI gate compares against)
        run: >
          pnpm --filter @vaanidesk/evals run --
          --trigger nightly
          --git-sha "$GITHUB_SHA"
          --git-branch main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.EVALS_DATABASE_URL }}
          AGENT_MODEL: claude-haiku-4-5-20251001
